<div class="feedback-page">

  <app-back-button></app-back-button>

  <div class="feedback-form-container">

    <h2>Share Your Experience</h2>

    <form (ngSubmit)="submitFeedback()" #feedbackForm="ngForm">

      <!-- Name & Designation -->
      <div class="row">

        <div class="col-md-6 mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Full Name"
            name="name"
            [(ngModel)]="userFeedback.name"
            required>
        </div>

        <div class="col-md-6 mb-3">
          <input
            type="text"
            class="form-control"
            placeholder="Designation"
            name="designation"
            [(ngModel)]="userFeedback.designation">
        </div>

      </div>

      <!-- Email -->
      <div class="mb-3">
        <input
          type="email"
          class="form-control"
          placeholder="Email Address"
          name="email"
          [(ngModel)]="userFeedback.email"
          required>
      </div>

      <!-- Rating -->
      <div class="mb-3">
        <select
          class="form-select"
          name="rating"
          [(ngModel)]="userFeedback.rating">

        <option value="⭐⭐⭐⭐⭐ Excellent">⭐⭐⭐⭐⭐ Excellent</option>

<option value="⭐⭐⭐⭐ Very Good">⭐⭐⭐⭐ Very Good</option>

<option value="⭐⭐⭐ Good">⭐⭐⭐ Good</option>

<option value="⭐⭐ Fair">⭐⭐ Fair</option>

<option value="⭐ Poor">⭐ Poor</option>

        </select>
      </div>

      <!-- Feedback -->
      <div class="mb-3">
        <textarea
          rows="5"
          class="form-control"
          placeholder="Write your feedback..."
          name="feedback"
          [(ngModel)]="userFeedback.feedback"
          required>
        </textarea>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary w-100">

        <i class="bi bi-send-fill"></i>
        Submit Feedback

      </button>

    </form>

  </div>

</div>
